name: Bug report
description: Reporta un bug en el CLI madkit
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Versión de madkit
      description: Output de `madkit --version`
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ejecuto `madkit iniciar .`
        2. Veo error X
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      render: shell
